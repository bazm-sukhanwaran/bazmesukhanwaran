  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #ffffff;
      color: #26352d;
      font-family: 'Noto Nastaliq Urdu', serif;
      line-height: 2.2;
    }

    .profile {
      max-width: 750px;
      margin: 35px auto;
      padding: 25px;

      border-radius: 18px;
      box-shadow: 0 5px 22px rgba(0,0,0,.05);
    }

    h1, h2 {
      color: #176b45;
    }

    .tag {
      color: #68746c;
    }

    .poetry-link {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 22px;
      background: #176b45;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .back {
      display: block;
      margin-top: 25px;
      color: #176b45;
    }
    .poet-photo {
  display: block;
  width: 180px;
  height: 180px;
  object-fit: cover;
  border-radius: 50%;
  margin: 0 auto 20px;
  border: 3px solid #e5e7eb;

<body>
  <main class="profile">
    <p class="tag">بزمِ سخنوران — تعارفِ شعراء</p>

    <img src="images/zabih.jpg"
     alt="شاعر ذبیحؔ کی تصویر"
     class="poet-photo">
    <h1>عبداللہ راشد شیخ</h1>
    <h2>تخلص: ذبیحؔ</h2>

    <p><strong>مقام:</strong> وجے پورہ، کرناٹک، بھارت</p>

    <h2>ادبی تعارف</h2>
    <p>
      اس حصے میں شاعر کا تفصیلی ادبی تعارف، ادبی سفر،
      شاعری سے وابستگی اور خدمات شامل کی جا سکتی ہیں۔
    </p>

    <a class="poetry-link" href="poetry.html">میرا کلام پڑھیے</a>

    <a class="back" href="index.html">← بزمِ سخنوران کے مرکزی صفحے پر واپس جائیں</a>
  </main>
