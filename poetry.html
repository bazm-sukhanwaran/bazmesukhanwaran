<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>کلامِ ذبیحؔ | بزمِ سخنوران</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #fff;
      color: #26352d;
      font-family: 'Noto Nastaliq Urdu', serif;
      line-height: 2.3;
    }

    main {
      max-width: 800px;
      margin: 30px auto;
    }

    header, .poem {
      padding: 22px;
      margin-bottom: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,.04);
    }

    h1, h2 {
      color: #176b45;
    }

    .poem {
      text-align: center;
      white-space: pre-line;
    }

    a {
      color: #176b45;
    }

    .note {
      color: #68746c;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>کلامِ ذبیحؔ</h1>
      <p>شاعر: عبداللہ راشد شیخ</p>
      <p class="note">بزمِ سخنوران — منتخب کلام</p>
      <a href="poet.html">شاعر کا تعارف پڑھیے</a>
    </header>

    <section class="poem">
      <h2>پہلی غزل</h2>
      <p>یہاں اپنی غزل کا عنوان اور اشعار شامل کریں۔</p>
    </section>

    <section class="poem">
      <h2>دوسری تخلیق</h2>
      <p>یہاں اپنی دوسری غزل، نظم یا تخلیق شامل کریں۔</p>
    </section>

    <p><a href="index.html">← مرکزی صفحے پر واپس جائیں</a></p>
  </main>
</body>
</html>
